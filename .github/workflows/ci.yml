name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build Docker image
        run: docker build -t secevalagent:ci .

  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-test-build
    # Regression gate on the labeled benchmark. Currently a no-op until the
    # benchmark (Week 4) and agent pipeline (Week 1-3) exist; fails the
    # build once a baseline F1 threshold is set in eval/run_eval.py.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run eval (non-blocking until benchmark exists)
        run: python -m eval.run_eval || echo "Eval skipped: no benchmark yet."
